workflows:
  android-build:
    name: Android Build Only
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - bassamsoftpro@gmail.com
